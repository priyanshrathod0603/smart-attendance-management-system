<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your email · KRISHNA PAYROLL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell" aria-labelledby="verify-title">
    <div class="auth-orb auth-orb-one" aria-hidden="true"></div><div class="auth-orb auth-orb-two" aria-hidden="true"></div>
    <section class="auth-card auth-card-login">
      <div class="auth-brand"><div class="auth-mark" aria-hidden="true">KP</div><div><p class="auth-brand-name">KRISHNA <span>PAYROLL</span></p><p class="auth-brand-sub">Enterprise Payroll &amp; HR Management System</p></div></div>
      <header class="auth-heading">
        <h1 id="verify-title">Check your email</h1>
        <p>We've sent a verification link to <strong>{{ email }}</strong>. Please click the link to activate your account.</p>
      </header>
      <form method="post" action="{{ url_for('auth.resend_verification') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="email" value="{{ email }}">
        <button class="auth-submit" type="submit">Resend verification email</button>
      </form>
      <p class="auth-signup">Already verified? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
      <footer class="auth-legal"><span>Secure &amp; Protected</span></footer>
    </section>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>
</html>
