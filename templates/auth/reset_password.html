<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose password · KRISHNA PAYROLL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell" aria-labelledby="new-password-title">
    <section class="auth-card auth-card-compact">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">KP</div>
        <div>
          <p class="auth-brand-name">KRISHNA <span>PAYROLL</span></p>
          <p class="auth-brand-sub">Enterprise Payroll &amp; HR Management System</p>
        </div>
      </div>

      <header class="auth-heading">
        <h1 id="new-password-title">Choose a password</h1>
        <p>Create a strong password to protect your payroll account.</p>
      </header>

      {% if error %}<div class="auth-alert auth-error" role="alert">{{ error }}</div>{% endif %}

      <form method="post" class="auth-form" id="reset-password-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <label for="new-password">New password</label>
        <div class="auth-input" id="password-container">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
          <input id="new-password" name="password" type="password" autocomplete="new-password" placeholder="6–12 characters with upper, lower & number" minlength="6" maxlength="12" required autofocus>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" tabindex="0">
            <svg class="icon-eye" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <div id="password-error" class="auth-field-error" style="display:none;" role="alert"></div>

        <button class="auth-submit" type="submit">Update password</button>
      </form>

      <p class="auth-signup"><a href="{{ url_for('auth.login') }}">← Back to sign in</a></p>
      
      <footer class="auth-legal">
        <span>Secure &amp; Protected</span>
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
      </footer>
    </section>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>
</html>
