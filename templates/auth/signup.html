<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · KRISHNA PAYROLL</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="auth-page"><main class="auth-shell" aria-labelledby="signup-title"><div class="auth-orb auth-orb-one" aria-hidden="true"></div><div class="auth-orb auth-orb-two" aria-hidden="true"></div><section class="auth-card auth-card-compact"><div class="auth-brand"><div class="auth-mark" aria-hidden="true">KP</div><div><p class="auth-brand-name">KRISHNA <span>PAYROLL</span></p><p class="auth-brand-sub">Enterprise Payroll &amp; HR Management System</p></div></div><header class="auth-heading"><h1 id="signup-title">Create account</h1><p>Set up your secure payroll workspace in a few moments.</p></header>{% if error %}<p class="auth-alert auth-error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="auth-form auth-standard-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="signup-name">Full name</label><input id="signup-name" name="name" autocomplete="name" placeholder="Enter your full name" required autofocus><label for="signup-email">Work email</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="12+ characters, with upper-case and a number" minlength="12" required><button class="auth-submit" type="submit">Create secure account</button></form><p class="auth-signup">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section></main></body></html>
