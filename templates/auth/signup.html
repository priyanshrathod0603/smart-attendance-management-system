<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · KRISHNA PAYROLL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell" aria-labelledby="signup-title">
    <section class="auth-card auth-card-compact">
      <div class="auth-brand">
        <div class="auth-mark" aria-hidden="true">KP</div>
        <div>
          <p class="auth-brand-name">KRISHNA <span>PAYROLL</span></p>
          <p class="auth-brand-sub">Enterprise Payroll &amp; HR Management System</p>
        </div>
      </div>

      <header class="auth-heading">
        <h1 id="signup-title">Create account</h1>
        <p>Set up your secure payroll workspace in a few moments.</p>
      </header>

      {% if error %}<div class="auth-alert auth-error" role="alert">{{ error }}</div>{% endif %}

      <form method="post" class="auth-form" id="signup-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <label for="signup-school-id">School ID / Institution Code</label>
        <div class="auth-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 11h2M6 15h2M11 11h2M11 15h2M16 11h2M16 15h2M12 3l9 4H3l9-4z"/></svg>
          <input id="signup-school-id" name="school_id" type="text" autocomplete="organization" placeholder="e.g. SCH-DELHI-01" required autofocus>
        </div>

        <label for="signup-school-name">Institution Name</label>
        <div class="auth-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <input id="signup-school-name" name="school_name" type="text" placeholder="e.g. Delhi Public School" required>
        </div>

        <label for="signup-name">Administrator Name</label>
        <div class="auth-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
          <input id="signup-name" name="name" type="text" autocomplete="name" placeholder="Enter administrator full name" required>
        </div>
        
        <label for="signup-email">Work email</label>
        <div class="auth-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
        </div>
        
        <label for="signup-password">Password</label>
        <div class="auth-input" id="password-container">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false" tabindex="0">
            <svg class="icon-eye" aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
        <div id="password-error" class="auth-field-error" style="display:none;" role="alert"></div>

        <button class="auth-submit" type="submit">Create secure account</button>
      </form>

      <p class="auth-signup">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
      
      <footer class="auth-legal">
        <span>Secure &amp; Protected</span>
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
      </footer>
    </section>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>
</html>
